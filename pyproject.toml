[project]
name = "mcp-software-engineering-agent"
version = "0.1.0"
description = "MCP Software Engineering Agent & Deterministic Evaluation Environment"
readme = "README.md"
authors = [
    { email = "kirubeshvarman28@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[project.scripts]
codeforgex = "mcp_server.server:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_server",
    "src/evaluator",
    "src/tasks",
    "src/agent",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

