name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Evaluate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run automated tests
        run: |
          pytest -v

      - name: Run deterministic benchmark evaluation
        run: |
          python scripts/run_evaluation.py --all --mode golden --format table

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t codeforgex:latest .

      - name: Run container verification
        run: |
          docker run --rm codeforgex:latest --test
          docker run --rm codeforgex:latest --evaluate-all
